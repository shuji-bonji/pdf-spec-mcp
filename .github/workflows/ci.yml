name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check engines.node against the lockfile
        run: npm run check:engines

      - name: Lint & format check (biome)
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Type check (incl. tests)
        run: npm run typecheck:tests

      - name: Build
        run: npm run build

      - name: Check the published types carry no SDK / zod
        run: npm run check:public-types

      - name: Test
        run: npm test
